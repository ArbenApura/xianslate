# Fly.io — Xianslate App B (Chromium scraper) — TARGET TOPOLOGY.
#
# Isolates Playwright/Chromium from the slim web/worker tier. NO public HTTP service (the web tier calls it
# over the Fly private network / .internal DNS); autostops when idle to save cost. Same region as App A.
#
# NOTE: this app is the target split — wiring the web tier to call it (instead of the in-process fetcher)
# is the remaining code step. See DEPLOYMENT.md (“Scraper split”). Deploy with:
#   fly deploy -c fly.scraper.toml --dockerfile Dockerfile.scraper

app = "xianslate-scraper"
primary_region = "sin" # MATCH App A / Neon (Singapore = ap-southeast-1).

[build]
dockerfile = "Dockerfile.scraper"

[env]
PORT = "3001"

[processes]
scraper = "node build"

# NO [http_service] — REACHED PRIVATELY VIA xianslate-scraper.internal:3001. AUTOSTOP WHEN IDLE.
[[vm]]
size = "shared-cpu-2x"
memory = "1gb"
processes = ["scraper"]

[[services]]
internal_port = 3001
protocol = "tcp"
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["scraper"]
