<!doctype html>
<html lang="en" class="%THEME_CLASS%" style="%THEME_STYLE%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="%THEME_COLOR%" />
		<script>
			// CAPACITOR SPA DATA INTERCEPTOR — THIS TEMPLATE (kit.files.appTemplate) IS USED ONLY BY
			// `yarn build:capacitor`. THE NATIVE WEBVIEW'S LOCAL SERVER CANNOT SERVE SvelteKit'S __data.json
			// DATA ENDPOINTS (NO SERVER-SIDE REWRITES — UNKNOWN PATHS RETURN A 404 WITH AN EMPTY JSON BODY,
			// WHICH THE ROUTER CHOKES ON), SO WE ANSWER THOSE REQUESTS IN-PROCESS WITH THE STATIC LAYOUT
			// PAYLOAD THE SPA NEEDS. THE WEB BUILD NEVER SHIPS THIS FILE.
			//
			// LAYOUT CHAIN (ALL SERVER NODES ARE STATIC IN THE STATIC SPA — PAGE DATA COMES FROM THE
			// CLIENT-SIDE UNIVERSAL LOADS, WHICH FETCH /api):
			//   root  (+layout.server.ts) → { theme }  — NO `user` KEY ON PURPOSE: data.user STAYS
			//          undefined SO THE CLIENT AUTH STORE RUNS THE /api/me PROBE (refreshUser), EXACTLY
			//          AS THE ORIGINAL SPA FALLBACK DESIGN INTENDED.
			//   /app  (+layout.server.ts guard) → {}
			//   account layout (no server load) → null
			//   page node (no server loads anywhere) → null
			(function () {
				if (
					!window.Capacitor ||
					typeof window.Capacitor.isNativePlatform !== 'function' ||
					!window.Capacitor.isNativePlatform()
				) {
					return;
				}
				const nativeFetch = window.fetch;
				// `data` MUST BE devalue's FLATTENED-ARRAY FORM (the client runs devalue.unflatten on it) —
				// devalue.stringify({ theme: 'sepia' }) === [{"theme":1},"sepia"], devalue.stringify({}) === [{}].
				const ROOT_NODE = { type: 'data', data: [{ theme: 1 }, 'sepia'], uses: {} };
				const APP_NODE = { type: 'data', data: [{}], uses: {} };
				function nodesFor(pathname) {
					const nodes = [ROOT_NODE];
					if (pathname === '/app' || pathname.startsWith('/app/')) {
						nodes.push(APP_NODE);
						if (pathname === '/app/account' || pathname.startsWith('/app/account/')) {
							nodes.push(null); // /app/account +layout.svelte (no server load)
						}
					}
					nodes.push(null); // THE PAGE NODE — EVERY PAGE'S DATA IS A CLIENT-SIDE UNIVERSAL LOAD
					return nodes;
				}
				window.fetch = function (input, init) {
					try {
						const url = typeof input === 'string' ? input : input && input.url;
						if (typeof url === 'string') {
							const u = new URL(url, location.href);
							if (u.pathname.endsWith('/__data.json')) {
								const body = JSON.stringify({ type: 'data', nodes: nodesFor(u.pathname) }) + '\n';
								return Promise.resolve(
									new Response(body, {
										status: 200,
										headers: { 'content-type': 'application/json' },
									}),
								);
							}
						}
					} catch {
						/* IGNORE — FALL THROUGH TO THE REAL FETCH */
					}
					return nativeFetch.apply(this, arguments);
				};
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
