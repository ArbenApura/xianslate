name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Fly.io (remote build)
        uses: superfly/flyctl-actions/deploy@master
        with:
          args: "--remote-only"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Fly creates an extra HA machine during zero-downtime deploys. Xianslate is
      # single-instance by design (in-process translation), so scale back to one.
      - name: Ensure single instance
        run: fly scale count 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
