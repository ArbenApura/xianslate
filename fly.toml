# fly.toml app configuration file generated for xianslate on 2026-08-04T11:33:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xianslate'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_POOL_MAX = '25'
  DEEPSEEK_CONCURRENCY = '64'
  NODE_OPTIONS = '--max-old-space-size=3072'
  PORT = '3000'
  ZYTE_RPS = '2'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 750
    soft_limit = 500

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
