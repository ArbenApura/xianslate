# Fly.io — Xianslate. SINGLE process: one `node build` machine serves HTTP and runs translations in-process
# (no Redis/queue/worker). Region MUST match the Neon region (low DB latency).
#
# SECRETS (set once, not in this file): see DEPLOYMENT.md —
#   fly secrets set DATABASE_URL=... DATABASE_URL_DIRECT=... DATABASE_URL_REPLICA=... \
#                   DEEPSEEK_API_KEY=... FIREBASE_SERVICE_ACCOUNT='{...}' \
#                   PUBLIC_FIREBASE_API_KEY=... PUBLIC_FIREBASE_AUTH_DOMAIN=... \
#                   PUBLIC_FIREBASE_PROJECT_ID=... PUBLIC_FIREBASE_APP_ID=...

app = "xianslate"
primary_region = "sin" # Singapore — MUST match the Neon region (ap-southeast-1). East-Asia alt: nrt / ap-northeast-1.

[build]
dockerfile = "Dockerfile"

[env]
PORT = "3000"
# GIVE NODE MORE HEAP THAN ITS ~2GB DEFAULT (SIZE TO ~75% OF THE MACHINE RAM — 3072 SUITS A 4GB VM).
NODE_OPTIONS = "--max-old-space-size=3072"
# TUNABLES (override per deployment): translation/scrape concurrency, DB pool, per-user budget.
QUOTA_USD_PER_WINDOW = "0.50"
DEEPSEEK_CONCURRENCY = "64"
SCRAPER_CONCURRENCY = "5"
DB_POOL_MAX = "25"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
# EACH LIVE TRANSLATION HOLDS ONE LONG SSE CONNECTION, SO THIS MUST EXCEED (concurrent translators + readers).
type = "requests"
soft_limit = 500
hard_limit = 750

[[http_service.checks]]
interval = "15s"
timeout = "2s"
grace_period = "10s"
method = "GET"
path = "/"

# NOTE: translation is in-process and stateful per machine, so keep this to ONE machine (don't `fly scale
# count > 1`). Scale UP (bigger machine) for more headroom, not out. Horizontal scaling would need a shared
# queue (removed) again.
